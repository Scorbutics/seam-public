# Green-gate CI (AI feedback, point 4): on every push/PR, a clean Ubuntu runner — itself a
# "fresh machine" — installs from zero and runs the same checks `make ci` runs locally:
# typecheck + unit tests, the README commands verbatim (offline subset; the model-backed ones
# are skipped honestly since no `claude` CLI exists in CI), an offline smoke over every sample
# diff. The .vsix build was removed when the VS Code extension was deprecated (2026-07-31).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The embedding weights are ~109MB and change only when the model id does, so cache them across runs.
      # `make install` fetches them when this misses; the key carries the model id so a model change re-fetches
      # rather than silently reusing the wrong geometry.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ts/node_modules/@xenova/transformers/.cache
          key: xenova-all-MiniLM-L6-v2-v1

      - name: Install deps (engine + extension) + embedding model
        run: make install

      # BUILD THE NATIVE CORE, without which this job cannot pass and never could.
      #
      # `ts/src/codebase/rust_core.ts` loads `rust/seam_core.node`, and since the TypeScript scan layer was
      # deleted there is no fallback — every test that touches a shape dies on the missing module. This workflow
      # had no Rust toolchain and no cargo step, so it had been red at 431 fail / 84 errors, i.e. it was not
      # measuring the code at all. A gate nobody can read is worse than no gate: it trains everyone to ignore
      # the one signal that would have caught a real regression.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build the native core
        working-directory: rust
        run: |
          cargo build --release -p seam-napi
          cp target/release/libseam_napi.so seam_core.node

      # Prove the core LOADS before running a suite whose failures would otherwise all look like logic bugs.
      - name: Core smoke
        run: |
          bun ts/src/cli/decompose.ts --locate loadAddon --repo . | tee /tmp/core.txt
          grep -q "rust_core.ts" /tmp/core.txt

      # ASSERT THE MODEL IS THERE, rather than letting its absence show up as three unrelated-looking grow
      # failures. seam-embed DEGRADES SILENTLY by design ("returns an empty result when the model is not
      # present"), which is right for a user and wrong for a gate: it turns an install fault into a scatter of
      # assertion errors in intent-ranked tests. That is exactly how these three read before the cause was found.
      - name: Embedding model present
        run: |
          test -f ts/node_modules/@xenova/transformers/.cache/Xenova/all-MiniLM-L6-v2/tokenizer.json
          test -d ts/node_modules/@xenova/transformers/.cache/Xenova/all-MiniLM-L6-v2/onnx

      - name: Typecheck + unit tests
        run: make test

      - name: README command audit (offline subset, verbatim)
        run: make readme-audit

      - name: Offline smoke on every sample diff
        run: make smoke

