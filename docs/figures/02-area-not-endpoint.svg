<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" role="img" aria-labelledby="t d">
<title id="t">Total input context per run</title>
<desc id="d">Total input context per run on one shared scale, refused calls hatched at the end of each bar, with a line at the control's 980k. Adjusted, the ideal arm is 1.003 times the control and the shipped tool 1.18; raw, 1.27 and 1.32.</desc>
<style>
  :root{
    --ink:#141C22; --ink-soft:#4A585F; --ink-faint:#7C8A90;
    --rule:#D2DAD9; --rule-soft:#E4EAE9; --panel:#FAFBFB;
    --arm-a:#2a78d6; --arm-b:#008300; --arm-c:#e87ba4;
    --premium:#C0761F; --premium-soft:#EBD6BA;
  }
  @media (prefers-color-scheme:dark){:root{
    --ink:#E2E9EA; --ink-soft:#9DAAAF; --ink-faint:#6F7D83;
    --rule:#2A363B; --rule-soft:#212C31; --panel:#182024;
    --arm-a:#3987e5; --arm-b:#008300; --arm-c:#d55181;
    --premium:#B8812A; --premium-soft:#4A3820;
  }}
  .bg{fill:var(--panel)}
  .ax{stroke:var(--rule);stroke-width:1;fill:none}
  .gl{stroke:var(--rule-soft);stroke-width:1;fill:none}
  .tk{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:var(--ink-faint)}
  .lb{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:var(--ink);font-weight:500}
  .lbs{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:var(--ink-soft)}
  .big{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px;fill:var(--ink);font-weight:600}
  .a{fill:var(--arm-a)} .b{fill:var(--arm-b)} .c{fill:var(--arm-c)} .p{fill:var(--premium)}
</style>
<rect class="bg" x="0" y="0" width="720" height="236"/>
  <defs>
  <pattern id="ref-a" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--arm-a)" stroke-width="2"/></pattern>
  <pattern id="ref-b" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--arm-b)" stroke-width="2"/></pattern>
  <pattern id="ref-c" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--arm-c)" stroke-width="2"/></pattern>
  <pattern id="ref-key" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink-soft)" stroke-width="2"/></pattern>
  </defs>
  <line class="gl" x1="160.0" y1="36" x2="160.0" y2="190"/>
  <text class="tk" x="160.0" y="206" text-anchor="middle">0</text>
  <line class="gl" x1="274.3" y1="36" x2="274.3" y2="190"/>
  <text class="tk" x="274.3" y="206" text-anchor="middle">400k</text>
  <line class="gl" x1="388.6" y1="36" x2="388.6" y2="190"/>
  <text class="tk" x="388.6" y="206" text-anchor="middle">800k</text>
  <line class="gl" x1="502.9" y1="36" x2="502.9" y2="190"/>
  <text class="tk" x="502.9" y="206" text-anchor="middle">1,200k</text>
  <line class="ax" x1="160" y1="190" x2="600" y2="190"/>
  <text class="lbs" x="160" y="226">total input context per run — cache read + cache write</text>
  <rect x="160" y="8" width="14" height="12" rx="2" fill="url(#ref-key)"/>
  <text class="lbs" x="180" y="18">refused calls — imposed by the harness, the only thing "adjusted" removes</text>
  <text class="lb" x="10" y="55">GREP</text>
  <text class="lbs" x="10" y="70">23.4 turns × 41.9k</text>
  <path class="a" d="M160.0,44 H436.0 Q440.0,44 440.0,48 V66 Q440.0,70 436.0,70 H160.0 Z"><title>GREP: 980k from turns the agent took</title></path>
  <text class="big" x="448.0" y="56">1.00×</text>
  <text class="lbs" x="448.0" y="70">980k</text>
  <text class="lb" x="10" y="111">SEAM</text>
  <text class="lbs" x="10" y="126">15.4 turns × 84.0k</text>
  <path class="b" d="M160.0,100 H491.1 V126 H160.0 Z"><title>SEAM: 1,159k from turns the agent took</title></path>
  <path fill="url(#ref-b)" d="M493.1,100 H525.4 Q529.4,100 529.4,104 V122 Q529.4,126 525.4,126 H493.1 Z"><title>SEAM: 134k from 1.6 refused calls per run</title></path>
  <text class="big" x="537.4" y="112">1.18×</text>
  <text class="lbs" x="537.4" y="126">1,159k · raw 1.32×</text>
  <text class="lb" x="10" y="167">REPLAY (ideal)</text>
  <text class="lbs" x="10" y="182">21.8 turns × 57.2k</text>
  <path class="c" d="M160.0,156 H440.9 V182 H160.0 Z"><title>REPLAY (ideal): 983k from turns the agent took</title></path>
  <path fill="url(#ref-c)" d="M442.9,156 H512.0 Q516.0,156 516.0,160 V178 Q516.0,182 512.0,182 H442.9 Z"><title>REPLAY (ideal): 263k from 4.6 refused calls per run</title></path>
  <text class="big" x="524.0" y="168">1.003×</text>
  <text class="lbs" x="524.0" y="182">983k · raw 1.27×</text>
  <line x1="440.0" y1="36" x2="440.0" y2="190" stroke="var(--ink)" stroke-width="1.4"/>
  <text class="lbs" x="440.0" y="32" text-anchor="middle">control 980k</text>
</svg>
