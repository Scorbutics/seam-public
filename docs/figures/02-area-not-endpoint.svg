<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="720" height="278" role="img" aria-labelledby="t d">
<title id="t">Total input context per run</title>
<desc id="d">Total input context per run on one shared scale, with a line at the control's 980k. The ideal arm's bar is split at the moment its answer was complete: 346k to reach it, 637k checking it afterwards, and 263k of refused calls, hatched. Adjusted, the ideal arm is 1.003 times the control and the shipped tool 1.18; raw, 1.27 and 1.32.</desc>
<style>
  :root{
    --ink:#141C22; --ink-soft:#4A585F; --ink-faint:#7C8A90;
    --rule:#D2DAD9; --rule-soft:#E4EAE9; --panel:#FAFBFB;
    --arm-a:#2a78d6; --arm-b:#008300; --arm-c:#e87ba4;
    --premium:#C0761F; --premium-soft:#EBD6BA;
  }
  @media (prefers-color-scheme:dark){:root{
    --ink:#E2E9EA; --ink-soft:#9DAAAF; --ink-faint:#6F7D83;
    --rule:#2A363B; --rule-soft:#212C31; --panel:#182024;
    --arm-a:#3987e5; --arm-b:#008300; --arm-c:#d55181;
    --premium:#B8812A; --premium-soft:#4A3820;
  }}
  .bg{fill:var(--panel)}
  .ax{stroke:var(--rule);stroke-width:1;fill:none}
  .gl{stroke:var(--rule-soft);stroke-width:1;fill:none}
  .tk{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:var(--ink-faint)}
  .lb{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:var(--ink);font-weight:500}
  .lbs{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:var(--ink-soft)}
  .big{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px;fill:var(--ink);font-weight:600}
  .chk{fill-opacity:.38;stroke:var(--arm-c);stroke-width:1} .chk-key{fill:var(--arm-c);fill-opacity:.38;stroke:var(--arm-c);stroke-width:1}
  .a{fill:var(--arm-a)} .b{fill:var(--arm-b)} .c{fill:var(--arm-c)} .p{fill:var(--premium)}
</style>
<rect class="bg" x="0" y="0" width="720" height="278"/>
  <defs>
  <pattern id="ref-a" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--arm-a)" stroke-width="2"/></pattern>
  <pattern id="ref-b" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--arm-b)" stroke-width="2"/></pattern>
  <pattern id="ref-c" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--arm-c)" stroke-width="2"/></pattern>
  <pattern id="ref-key" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink-soft)" stroke-width="2"/></pattern>
  </defs>
  <line class="gl" x1="160.0" y1="60" x2="160.0" y2="232"/>
  <text class="tk" x="160.0" y="248" text-anchor="middle">0</text>
  <line class="gl" x1="274.3" y1="60" x2="274.3" y2="232"/>
  <text class="tk" x="274.3" y="248" text-anchor="middle">400k</text>
  <line class="gl" x1="388.6" y1="60" x2="388.6" y2="232"/>
  <text class="tk" x="388.6" y="248" text-anchor="middle">800k</text>
  <line class="gl" x1="502.9" y1="60" x2="502.9" y2="232"/>
  <text class="tk" x="502.9" y="248" text-anchor="middle">1,200k</text>
  <line class="ax" x1="160" y1="232" x2="600" y2="232"/>
  <text class="lbs" x="160" y="268">total input context per run — cache read + cache write</text>
  <rect class="chk-key" x="160" y="8" width="14" height="12" rx="2"/>
  <text class="lbs" x="180" y="18">checking after DONE — the answer was already complete (ideal arm only)</text>
  <rect x="160" y="26" width="14" height="12" rx="2" fill="url(#ref-key)"/>
  <text class="lbs" x="180" y="36">refused calls — imposed by the harness, the only thing "adjusted" removes</text>
  <text class="lb" x="10" y="79">GREP</text>
  <text class="lbs" x="10" y="94">23.4 turns × 41.9k</text>
  <path class="a" d="M160.0,68 H436.0 Q440.0,68 440.0,72 V90 Q440.0,94 436.0,94 H160.0 Z"><title>GREP: 980k from turns the agent took</title></path>
  <text class="big" x="448.0" y="80">1.00×</text>
  <text class="lbs" x="448.0" y="94">980k</text>
  <text class="lb" x="10" y="135">SEAM</text>
  <text class="lbs" x="10" y="150">15.4 turns × 84.0k</text>
  <path class="b" d="M160.0,124 H491.1 V150 H160.0 Z"><title>SEAM: 1,159k from turns the agent took</title></path>
  <path fill="url(#ref-b)" d="M493.1,124 H525.4 Q529.4,124 529.4,128 V146 Q529.4,150 525.4,150 H493.1 Z"><title>SEAM: 134k from 1.6 refused calls per run</title></path>
  <text class="big" x="537.4" y="136">1.18×</text>
  <text class="lbs" x="537.4" y="150">1,159k · raw 1.32×</text>
  <text class="lb" x="10" y="191">REPLAY (ideal)</text>
  <text class="lbs" x="10" y="206">21.8 turns × 57.2k</text>
  <path class="c" d="M160.0,180 H258.9 V206 H160.0 Z"><title>REPLAY (ideal): 346k to reach the complete answer (DONE at call 6)</title></path>
  <text class="lbs" x="209.4" y="220" text-anchor="middle">to DONE · 346k</text>
  <path class="c chk" d="M260.9,180 H440.9 V206 H260.9 Z"><title>REPLAY (ideal): 637k checking the answer after DONE</title></path>
  <text class="lbs" x="350.9" y="220" text-anchor="middle">checking · 637k</text>
  <path fill="url(#ref-c)" d="M442.9,180 H512.0 Q516.0,180 516.0,184 V202 Q516.0,206 512.0,206 H442.9 Z"><title>REPLAY (ideal): 263k from 4.6 refused calls per run, all after DONE</title></path>
  <text class="big" x="524.0" y="192">1.003×</text>
  <text class="lbs" x="524.0" y="206">983k · raw 1.27×</text>
  <line x1="440.0" y1="60" x2="440.0" y2="232" stroke="var(--ink)" stroke-width="1.4"/>
  <text class="lbs" x="440.0" y="56" text-anchor="middle">control 980k</text>
</svg>
