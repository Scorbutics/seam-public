[pytest]
# Integration tests spin up REAL language servers (typescript-language-server, pyright) and a daemon.
# They pass individually but compound when many run in one session (server startup/index, contention),
# and they need a toolchain (bun + cached servers). So they're OPT-IN — the default gate stays fast and
# deterministic. Run them explicitly (ideally one at a time):  pytest eval/ -m integration
markers =
    integration: real-LSP-server / daemon tests — slow, need a toolchain; excluded from the default run
addopts = -m "not integration"
