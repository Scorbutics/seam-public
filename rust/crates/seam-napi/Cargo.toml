[package]
name = "seam-napi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
seam-lang = { path = "../seam-lang" }
seam-resolve = { path = "../seam-resolve" }
seam-scan = { path = "../seam-scan" }
seam-grow = { path = "../seam-grow" }
seam-cache = { path = "../seam-cache" }
seam-shapes = { path = "../seam-shapes" }
seam-couple = { path = "../seam-couple" }
seam-fs = { path = "../seam-fs" }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
