# Seam Rust core — a workspace. Crate boundaries enforce the layering (no crate reaches into another's
# internals), which is the strongest guard against the tight coupling the TS engine accumulated.
#
#   seam-fs       file enumeration (git walk)              — no deps
#   seam-lang     language layer: traits + per-language    — deps: seam-fs
#                 modules + tree-sitter substrate
#   seam-resolve  language-agnostic cross-file logic       — deps: seam-lang, seam-fs
#                 (import index, workspace, consumers)
#   seam-napi     thin napi binding (DTOs + entry points)  — deps: all
[workspace]
resolver = "2"
members = ["crates/seam-fs", "crates/seam-lang", "crates/seam-resolve", "crates/seam-scan", "crates/seam-shapes", "crates/seam-couple", "crates/seam-napi"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
once_cell = "1"
regex = "1"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tree-sitter = "0.25"

[profile.release]
lto = true
