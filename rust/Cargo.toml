# Seam Rust core. napi-rs in-process addon (the migration's FFI boundary). Phase 1: the foundation +
# the first vertical slice (`--query consumers`), built byte-identical against the TS engine.
[package]
name = "seam_core"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
regex = "1"
once_cell = "1"
# Match Seam's web-tree-sitter 0.25 core so native ASTs line up with the bundled wasm grammars.
tree-sitter = "0.25"
# The Java grammar is VENDORED (vendor/java/parser.c, from tree-sitter-java 0.20.2 — the exact source
# tree-sitter-wasms@0.1.13 bundles) and compiled by build.rs against this single tree-sitter runtime.

[build-dependencies]
napi-build = "2"
cc = "1"

[profile.release]
lto = true
